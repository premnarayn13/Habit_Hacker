spring:
  application:
    name: habit-hacker-backend

  # ─── LOCAL DEVELOPMENT (H2 in-memory) ───────────────────────────────────────
  # When SPRING_DATASOURCE_URL is NOT set, H2 is used automatically.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:habithackerdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: false

  # ─── FLYWAY MIGRATIONS ───────────────────────────────────────────────────────
  # Disabled for H2 local; enabled automatically when PostgreSQL URL is set.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration

  autoconfigure:
    exclude: ${FLYWAY_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration}

# ─── SUPABASE ─────────────────────────────────────────────────────────────────
supabase:
  url: ${SUPABASE_URL:https://phsubtmwjfkspqpzusxm.supabase.co}
  jwt-secret: ${SUPABASE_JWT_SECRET:super-secret-jwt-key-minimum-256-bits-for-hmac-sha256-habithacker}
  anon-key: ${SUPABASE_ANON_KEY:sb_publishable_p2xKtuWO_AoxUEljV9FAgg_SB9PgNSN}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

# ─── SERVER ───────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}

# ─── ACTUATOR ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ─── GROQ / LLM AI ────────────────────────────────────────────────────────────
groq:
  api:
    url: ${GROQ_API_URL:${OPENAI_API_URL:${LLM_API_URL:https://api.groq.com/openai/v1/chat/completions}}}
    key: ${GROQ_API_KEY:${LLM_TOKEN:${OPENAI_API_KEY:${LLM_API_KEY:${GROQ_KEY:${AI_API_KEY:}}}}}}
  model:
    id: ${GROQ_MODEL_ID:${LLM_MODEL:llama-3.3-70b-versatile}}

# ─── CORS ALLOWED ORIGINS ─────────────────────────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174}

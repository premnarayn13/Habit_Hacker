# ─────────────────────────────────────────────────────────────────────────────
# render.yaml — Habit Hacker Backend Docker Blueprint Deployment on Render
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: habit-hacker-backend
    runtime: docker
    dockerfilePath: project/backend/Dockerfile
    dockerContext: project/backend
    plan: free
    region: oregon

    # Health check path (Spring Boot Actuator endpoint)
    healthCheckPath: /actuator/health

    # Environment variables configured in Render Dashboard
    envVars:
      - key: PORT
        value: "8080"

      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://<your-supabase-or-render-db-host>:5432/postgres

      - key: SPRING_DATASOURCE_USERNAME
        value: postgres

      - key: SPRING_DATASOURCE_PASSWORD
        value: <your-database-password>

      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver

      - key: HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect

      - key: JPA_DDL_AUTO
        value: update

      - key: FLYWAY_ENABLED
        value: "false"

      - key: SUPABASE_URL
        value: https://phsubtmwjfkspqpzusxm.supabase.co

      - key: CORS_ALLOWED_ORIGINS
        value: "*"

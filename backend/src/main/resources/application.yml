spring:
  application:
    name: habit-hacker-backend
  profiles:
    active: dev
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  datasource:
    url: jdbc:h2:mem:habithackerdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

supabase:
  url: ${SUPABASE_URL:https://xyzcompany.supabase.co}
  jwt-secret: ${SUPABASE_JWT_SECRET:super-secret-jwt-key-minimum-256-bits-length-for-hmac-sha256-security-validation-habithacker}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

